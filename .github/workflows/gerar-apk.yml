name: Gerar APK ClassMana QR
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # O Ubuntu do GitHub já inclui Android SDK; evita falha de aceite de licenças em setup-android@v3.
      - name: Conferir Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar icone ClassMana sem fundo branco
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          src=Path("app/src/main/res/drawable/classmana_app_icon.png")
          im=Image.open(src).convert("RGBA")
          # Remove margens transparentes, ampliando a marca dentro da area do launcher.
          bbox=im.getchannel("A").getbbox()
          if bbox:
              im=im.crop(bbox)
          # Aplicativos Android exibem o foreground dentro de uma mascara adaptativa.
          canvas=Image.new("RGBA",(432,432),(0,0,0,0))
          im.thumbnail((396,396),Image.Resampling.LANCZOS)
          canvas.alpha_composite(im,((432-im.width)//2,(432-im.height)//2))
          out=Path("app/src/main/res/drawable/classmana_launcher_foreground.png")
          canvas.save(out,optimize=True)
          PY
      - name: Build APK debug
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain assembleDebug 2>&1 | tee build-output.log
      - name: Exibir erros Kotlin/Gradle
        if: failure()
        run: |
          echo '### Erros de compilação' >> "$GITHUB_STEP_SUMMARY"
          grep -E '(^e: |^error: |\.kt:[0-9]+:|Unresolved reference|Compilation error|FAILURE:|What went wrong)' build-output.log | tail -n 60 | tee -a "$GITHUB_STEP_SUMMARY" || true
      - name: Nomear APK como ClassMana.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk ClassMana.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ClassMana-Android
          path: ClassMana.apk
          if-no-files-found: error
