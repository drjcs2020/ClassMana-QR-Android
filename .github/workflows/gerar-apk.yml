name: Gerar APK ClassMana QR
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # O Ubuntu do GitHub já inclui Android SDK; evita falha de aceite de licenças em setup-android@v3.
      - name: Conferir Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Ajustar escala da logo original para o icone circular
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          src = Path("app/src/main/res/drawable/classmana_app_icon.png")
          im = Image.open(src).convert("RGBA")
          bbox = im.getchannel("A").getbbox()
          if bbox:
              im = im.crop(bbox)
          # O logo original ocupa 96% da area; sem mudar a arte.
          size = 432
          scaled = im.resize((330, 330), Image.Resampling.LANCZOS)
          canvas = Image.new("RGBA", (size, size), (0, 0, 0, 0))
          canvas.alpha_composite(scaled, (51, 51))
          canvas.save("app/src/main/res/drawable/classmana_launcher_foreground.png", optimize=True)
          PY
      - name: Verificar assinatura permanente
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.CLASSMANA_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.CLASSMANA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CLASSMANA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CLASSMANA_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_B64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Assinatura permanente nao configurada: somente APK de teste, sem publicacao." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preparar chave de assinatura permanente
        if: steps.signing.outputs.enabled == 'true'
        env:
          CLASSMANA_KEYSTORE_BASE64: ${{ secrets.CLASSMANA_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$CLASSMANA_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/classmana-release.jks"
          chmod 600 "$RUNNER_TEMP/classmana-release.jks"
      - name: Compilar APK assinado para atualizacoes
        if: steps.signing.outputs.enabled == 'true'
        env:
          CLASSMANA_KEYSTORE_PATH: ${{ runner.temp }}/classmana-release.jks
          CLASSMANA_KEYSTORE_PASSWORD: ${{ secrets.CLASSMANA_KEYSTORE_PASSWORD }}
          CLASSMANA_KEY_ALIAS: ${{ secrets.CLASSMANA_KEY_ALIAS }}
          CLASSMANA_KEY_PASSWORD: ${{ secrets.CLASSMANA_KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain assembleRelease 2>&1 | tee build-output.log
      - name: Compilar somente APK de teste
        if: steps.signing.outputs.enabled != 'true'
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain assembleDebug 2>&1 | tee build-output.log
      - name: Exibir erros Kotlin/Gradle
        if: failure()
        run: |
          echo '### Erros de compilação' >> "$GITHUB_STEP_SUMMARY"
          grep -E '(^e: |^error: |\.kt:[0-9]+:|Unresolved reference|Compilation error|FAILURE:|What went wrong)' build-output.log | tail -n 60 | tee -a "$GITHUB_STEP_SUMMARY" || true
      - name: Nomear APK como ClassMana.apk
        run: |
          if [[ "${{ steps.signing.outputs.enabled }}" == "true" ]]; then
            cp app/build/outputs/apk/release/app-release.apk ClassMana.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk ClassMana.apk
          fi
      - name: Publicar APK no GitHub Releases
        if: github.ref == 'refs/heads/main' && steps.signing.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(python3 - <<'PY'
          import pathlib, re
          source = pathlib.Path('app/build.gradle.kts').read_text()
          match = re.search(r'versionName\s*=\s*"([^"]+)"', source)
          print(match.group(1) if match else '')
          PY
          )
          test -n "$VERSION"
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" ClassMana.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" ClassMana.apk --repo "$GITHUB_REPOSITORY" --title "ClassMana $VERSION" --notes "APK ClassMana $VERSION. Instale usando o instalador do Android."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ClassMana-APK-compilado
          path: ClassMana.apk
          if-no-files-found: error
